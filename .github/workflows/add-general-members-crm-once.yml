name: Add general members CRM once
on:
  push:
    branches:
      - feature/tdea-identity-profile
    paths:
      - .github/workflows/add-general-members-crm-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/add-general-members-crm.py
      - name: Verify
        shell: bash
        run: |
          node --check public/app.js
          grep -q 'nav("general", "一般會員")' public/app.js
          grep -q 'nav("association", "協會會員")' public/app.js
          grep -q 'nav("vendor", "廠商會員")' public/app.js
          grep -q '/api/general-members' public/app.js
          grep -q '/api/general-members' src/monthly-entry.ts
          grep -q 'TDEA-DESIGN D1' public/app.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add public/app.js src/monthly-entry.ts
          git commit -m "Add canonical general members to CRM"
          git rm .github/workflows/add-general-members-crm-once.yml .github/scripts/add-general-members-crm.py
          git commit -m "Remove one-time general member CRM patch files"
          git push origin feature/tdea-identity-profile
