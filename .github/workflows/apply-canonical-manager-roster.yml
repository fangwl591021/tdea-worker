name: Apply canonical manager roster
on:
  push:
    paths:
      - 'tools/apply-canonical-manager-roster.js'
      - '.github/workflows/apply-canonical-manager-roster.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-manager-roster-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node tools/apply-canonical-manager-roster.js
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify no business AIWE fallback
        shell: bash
        run: |
          grep -n "readAiweMembers(env)" src/monthly-entry.ts || true
          grep -n "writeAiweMembers(env" src/monthly-entry.ts || true
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/monthly-entry.ts
          git commit -m "fix: make manager roster canonical across member flows"
          git push origin HEAD:agent/canonical-manager-roster-only
