name: Bump TDEA activity editor assets once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: ['.github/workflows/bump-activity-editor-assets-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Bump asset versions
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/admin-login.js')
          s=p.read_text(encoding='utf-8')
          s2=s.replace('"app.js?v=activity-editor4"','"app.js?v=activity-editor5"',1).replace('"form-builder.js?v=form16"','"form-builder.js?v=form17"',1)
          if s2==s: raise SystemExit('admin-login version targets not found')
          p.write_text(s2,encoding='utf-8')
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          s2=s.replace('/admin-login.js?v=admin-entry23','/admin-login.js?v=admin-entry24',1)
          if s2==s: raise SystemExit('index admin-login version target not found')
          p.write_text(s2,encoding='utf-8')
      - name: Verify
        run: |
          node --check public/admin-login.js
          grep -n 'activity-editor5\|form17' public/admin-login.js
          grep -n 'admin-entry24' public/index.html
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/admin-login.js public/index.html
          git commit -m "Bust TDEA activity editor asset cache"
          git rm .github/workflows/bump-activity-editor-assets-once.yml
          git commit -m "Remove activity editor asset bump workflow"
          git push origin HEAD:feature/tdea-identity-profile
