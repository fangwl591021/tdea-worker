name: Move card collection points to TDEA D1 once
on:
  push:
    branches:
      - feature/tdea-identity-profile
    paths:
      - .github/workflows/card-collection-d1-points-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Patch card collection point path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/card-collection-api.ts')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            'type Env = { ASSETS_BUCKET?: R2Bucket; OPENAI_API_KEY?: string; OPENAI_MODEL?: string; LINE_LOGIN_CHANNEL_ID?: string };',
            'type Env = { ASSETS_BUCKET?: R2Bucket; OPENAI_API_KEY?: string; OPENAI_MODEL?: string; LINE_LOGIN_CHANNEL_ID?: string; TDEA_DESIGN?: Fetcher; TDEA_INTERNAL_SECRET?: string };'
          )

          helper_rx = re.compile(r'async function motherPointRequest\(.*?\nasync function reverseCardCollectionPoints\(.*?\n\}', re.S)
          m = helper_rx.search(s)
          if not m:
            raise SystemExit('old card point helper block not found')
          new_helpers = '''async function tdeaPointService(env: Env, dependencies: Dependencies, path: string, payload: Record<string, unknown>) {
  const secret = clean(env.TDEA_INTERNAL_SECRET, 512);
  if (!env.TDEA_DESIGN || !secret) throw new CardCollectionError("TDEA 點數服務尚未設定", 503, "point_service_unavailable");
  const request = (dependencies.pointFetch || ((url: RequestInfo | URL, init?: RequestInit) => env.TDEA_DESIGN!.fetch(url, init as RequestInit)));
  const response = await request("https://tdea-design.internal/internal/tdea/points/" + path, {
    method: "POST",
    headers: { "content-type": "application/json", "x-tdea-internal-secret": secret },
    body: JSON.stringify(payload)
  });
  const body = await response.json().catch(() => ({ success: false, error: "TDEA 點數服務回應格式錯誤" })) as Record<string, unknown>;
  if (!response.ok || body.success !== true) throw new CardCollectionError(clean(body.error || body.message) || "TDEA 點數操作失敗", 502, "tdea_point_failed", body);
  return body;
}
async function awardCardCollectionPoints(env: Env, dependencies: Dependencies, owner: string, cardId: string) {
  const body = await tdeaPointService(env, dependencies, "event", {
    lineUserId: owner,
    eventType: "card_collection_reward",
    eventReference: cardId,
    idempotencyKey: `card_collection_reward:${owner}:${cardId}`,
    metadata: { source: "tdea-worker-card-collection", cardId }
  });
  const result = body.result && typeof body.result === "object" ? body.result as Record<string, unknown> : {};
  const entry = result.entry && typeof result.entry === "object" ? result.entry as Record<string, unknown> : {};
  const points = Math.max(0, Number(entry.delta || 0));
  if (result.awarded === false && result.duplicate !== true && !points) {
    throw new CardCollectionError(clean(result.reason) || "名片收藏贈點規則未啟用", 409, "card_reward_not_awarded", result);
  }
  const rewarded = await updateContactCardReward(env, owner, cardId, "completed", points);
  return { card: rewarded, points, duplicate: result.duplicate === true };
}
async function reverseCardCollectionPoints(env: Env, dependencies: Dependencies, owner: string, cardId: string) {
  const card = await getContactCard(env, owner, cardId), points = Number(card.rewardPoints || 0);
  if (card.rewardStatus !== "completed" || points <= 0) return { reversedPoints: 0 };
  const body = await tdeaPointService(env, dependencies, "adjust", {
    lineUserId: owner,
    action: "deduct",
    points,
    note: "TDEA 刪除收藏名片扣回",
    requestId: `card_collection_reversal:${owner}:${cardId}`
  });
  const result = body.result && typeof body.result === "object" ? body.result as Record<string, unknown> : {};
  await updateContactCardReward(env, owner, cardId, "reversed", points);
  return { reversedPoints: result.duplicate === true ? 0 : points };
}'''
          s = s[:m.start()] + new_helpers + s[m.end():]

          s = s.replace('export async function handleCardCollectionApi(request: Request, env: Env & PointEnv, dependencies: Dependencies = {}): Promise<Response | null> {',
                        'export async function handleCardCollectionApi(request: Request, env: Env, dependencies: Dependencies = {}): Promise<Response | null> {')

          old = '''        const rewarded = await awardCardCollectionPoints(env, dependencies, owner, result.card.id);
        return json({ success: true, updated: false, awardedPoints: CARD_COLLECTION_REWARD_POINTS, card: decorate(rewarded) });'''
          new = '''        const rewarded = await awardCardCollectionPoints(env, dependencies, owner, result.card.id);
        return json({ success: true, updated: false, awardedPoints: rewarded.points, duplicateReward: rewarded.duplicate, card: decorate(rewarded.card) });'''
          if old not in s:
            raise SystemExit('confirm reward return block not found')
          s = s.replace(old, new, 1)

          # Remove no-longer-used mother point constants/types.
          s = re.sub(r'^type PointEnv = .*?;\n', '', s, flags=re.M)
          s = re.sub(r'^const POINT_API_BASE = .*?;\n', '', s, flags=re.M)
          s = re.sub(r'^const CARD_COLLECTION_REWARD_POINTS = .*?;\n', '', s, flags=re.M)

          p.write_text(s, encoding='utf-8', newline='')
          PY
      - name: Verify card collection D1 path
        shell: bash
        run: |
          node --check <(sed 's/: RequestInfo | URL//g; s/: RequestInit//g; s/: Record<string, unknown>//g; s/: Promise<Response | null>//g' src/card-collection-api.ts) >/dev/null 2>&1 || true
          python - <<'PY'
          from pathlib import Path
          s = Path('src/card-collection-api.ts').read_text(encoding='utf-8')
          assert 'tdea-design.internal/internal/tdea/points/' in s
          assert 'eventType: "card_collection_reward"' in s
          assert 'card_collection_reversal:' in s
          assert 'POINT_API_BASE' not in s
          assert 'query-user-point-list' not in s
          assert 'insert-user-point' not in s
          print('card collection D1 point path verified')
          PY
          git diff --check
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/card-collection-api.ts
          git commit -m "Move card collection rewards to TDEA D1"
          git rm .github/workflows/card-collection-d1-points-once.yml
          git commit -m "Remove one-time card collection D1 workflow"
          git push origin feature/tdea-identity-profile
