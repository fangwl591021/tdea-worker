name: Cleanup test registration once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-test-registration-once.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel 王子齊 test registration
        run: |
          python - <<'PY'
          import json
          import urllib.request

          base = "https://tdeawork.fangwl591021.workers.dev"
          code = "THDQ2BXR"
          expected_name = "王子齊"
          browser_headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.8",
          }

          query_request = urllib.request.Request(
              f"{base}/api/native-registrations/query?code={code}",
              headers=browser_headers,
              method="GET",
          )
          with urllib.request.urlopen(query_request, timeout=30) as response:
              payload = json.load(response)

          if not payload.get("success"):
              raise SystemExit(f"query failed: {payload}")

          data = payload.get("data") or {}
          haystack = json.dumps(data, ensure_ascii=False)
          if expected_name not in haystack:
              raise SystemExit(f"safety check failed: expected name {expected_name} not found")

          registration_id = str(data.get("id") or data.get("registrationId") or "").strip()
          if not registration_id:
              raise SystemExit("registration id missing")

          body = json.dumps({"registrationId": registration_id, "queryCode": code}).encode("utf-8")
          request = urllib.request.Request(
              f"{base}/api/native-registrations/cancel",
              data=body,
              headers={**browser_headers, "content-type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)

          if not result.get("success"):
              raise SystemExit(f"cancel failed: {result}")
          print(json.dumps({"success": True, "registrationId": registration_id, "name": expected_name}, ensure_ascii=False))
          PY
