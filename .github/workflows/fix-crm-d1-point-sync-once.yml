name: Fix CRM D1 point sync once
on:
  push:
    branches:
      - feature/tdea-identity-profile
    paths:
      - .github/workflows/fix-crm-d1-point-sync-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/fix_crm_d1_point_sync.py
      - name: Verify diff
        run: git diff --check || true
      - name: Commit patch and cleanup
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/monthly-entry.ts public/app.js
          git commit -m "Sync CRM roster balances from TDEA D1"
          git rm .github/workflows/fix-crm-d1-point-sync-once.yml .github/scripts/fix_crm_d1_point_sync.py
          git commit -m "Remove one-time CRM point sync patch files"
          git push origin feature/tdea-identity-profile
