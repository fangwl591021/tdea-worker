name: Fix custom fields native source once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths:
      - scripts/fix-custom-fields-native-source.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/fix-custom-fields-native-source.mjs
      - name: Verify
        run: |
          node --check public/app.js
          grep -q 'hydrateCustomRegistrationFieldsFromNativeForm' public/app.js
          grep -q '/api/native-forms/' public/app.js
      - name: Commit and cleanup
        run: |
          rm -f scripts/fix-custom-fields-native-source.mjs
          rm -f .github/workflows/fix-custom-fields-native-source-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js scripts/fix-custom-fields-native-source.mjs .github/workflows/fix-custom-fields-native-source-once.yml
          git commit -m 'Use native form as custom field source'
          git push origin HEAD:feature/tdea-identity-profile
