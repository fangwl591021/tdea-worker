name: Fix custom fields persistence once
on:
  push:
    branches:
      - feature/tdea-identity-profile
    paths:
      - .github/scripts/fix-custom-fields-persistence.py
      - .github/workflows/fix-custom-fields-persistence-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix-custom-fields-persistence.py
      - name: Verify
        run: |
          node --check public/app.js
          grep -n "fields: Array.isArray(registrationSettings?.fields)" public/app.js
      - name: Commit and cleanup
        run: |
          rm -f .github/scripts/fix-custom-fields-persistence.py .github/workflows/fix-custom-fields-persistence-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js .github/scripts/fix-custom-fields-persistence.py .github/workflows/fix-custom-fields-persistence-once.yml
          git commit -m "Persist custom registration fields"
          git push origin HEAD:feature/tdea-identity-profile
