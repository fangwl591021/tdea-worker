name: Fix custom fields persistence v2 once
on:
  push:
    branches: [feature/tdea-identity-profile]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/fix-custom-fields-persistence-v2.mjs
      - name: Verify
        run: |
          node --check public/app.js
          grep -n 'let registrationSettings = null' public/app.js
          grep -n 'activity.formSettings || {}' public/app.js
          grep -n 'await saveManagerDataRemoteChecked()' public/app.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'fangwl591021'
          git config user.email '50135766+fangwl591021@users.noreply.github.com'
          git rm -f scripts/fix-custom-fields-persistence-v2.mjs .github/workflows/fix-custom-fields-persistence-v2-once.yml
          git add public/app.js
          git commit -m 'Fix custom registration field persistence'
          git push origin HEAD:feature/tdea-identity-profile
