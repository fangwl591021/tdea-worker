name: Fix custom fields reopen hydration once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: ['.github/workflows/fix-custom-fields-reopen-hydration-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          old='''  function ensureActivityEditorFields() {\n    const form = document.querySelector("#drawer-activity");\n    if (!form || form.dataset.mediaFieldsReady) return;\n    form.dataset.mediaFieldsReady = "true";\n    ensureActivityMediaStyles();\n    const id = form.querySelector("input[name='id']")?.value || "";\n    const activity = state.data.activities.find((item) => item.id === id) || {};'''
          new='''  function ensureActivityEditorFields() {\n    const form = document.querySelector("#drawer-activity");\n    if (!form) return;\n    const id = form.querySelector("input[name='id']")?.value || "";\n    const activity = state.data.activities.find((item) => item.id === id) || {};\n    if (form.dataset.mediaFieldsReady) {\n      const textarea = form.querySelector("[name='customRegistrationFields']");\n      if (textarea) {\n        textarea.value = serializeCustomRegistrationFields(activity);\n        hydrateCustomRegistrationFieldsFromNativeForm(activity, textarea).catch(() => false);\n      }\n      return;\n    }\n    form.dataset.mediaFieldsReady = "true";\n    ensureActivityMediaStyles();'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Verify
        run: |
          node --check public/app.js
          grep -n -A24 'function ensureActivityEditorFields' public/app.js
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name fangwl591021
          git config user.email 50135766+fangwl591021@users.noreply.github.com
          git add public/app.js
          git commit -m "Rehydrate custom fields when activity editor reopens"
          git rm .github/workflows/fix-custom-fields-reopen-hydration-once.yml
          git commit -m "Cleanup custom field reopen workflow"
          git push origin feature/tdea-identity-profile
