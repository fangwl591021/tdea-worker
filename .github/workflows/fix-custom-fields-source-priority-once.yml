name: Fix custom field source priority once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: ['.github/workflows/fix-custom-fields-source-priority-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          old='''  function storedFormSettingsForActivity(activity = {}) {\n    const settings = state.data.formSettings || {};\n    return settings[activity.id] || settings[activity.activityNo] || activity.formSettings || {};\n  }'''
          new='''  function storedFormSettingsForActivity(activity = {}) {\n    const settings = state.data.formSettings || {};\n    const byActivityNo = activity.activityNo ? settings[activity.activityNo] || {} : {};\n    const byId = activity.id ? settings[activity.id] || {} : {};\n    const activitySettings = activity.formSettings && typeof activity.formSettings === "object" ? activity.formSettings : {};\n    return { ...byActivityNo, ...byId, ...activitySettings };\n  }'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Verify
        run: |
          node --check public/app.js
          grep -n -A8 'function storedFormSettingsForActivity' public/app.js
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name fangwl591021
          git config user.email 50135766+fangwl591021@users.noreply.github.com
          git add public/app.js
          git commit -m "Prefer activity form settings for custom fields"
          git rm .github/workflows/fix-custom-fields-source-priority-once.yml
          git commit -m "Cleanup one-time custom field source workflow"
          git push origin feature/tdea-identity-profile