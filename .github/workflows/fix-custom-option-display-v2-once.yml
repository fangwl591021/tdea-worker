name: Fix custom option display v2 once
on:
  push:
    paths:
      - '.github/workflows/fix-custom-option-display-v2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Patch native form option display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/native-form.js')
          s=p.read_text(encoding='utf-8')
          old='''  function selectedValue(value, option) {\n    if (Array.isArray(value)) return value.map(String).includes(String(option));\n    return String(value ?? "") === String(option);\n  }\n'''
          new='''  function optionText(option) {\n    if (typeof option === "string" || typeof option === "number") return trim(option);\n    if (!option || typeof option !== "object") return "";\n    return trim(option.label || option.name || option.value || option.text || option.title);\n  }\n\n  function selectedValue(value, option) {\n    const normalizedOption = optionText(option);\n    if (Array.isArray(value)) return value.map((item) => optionText(item) || String(item)).includes(normalizedOption);\n    return String(value ?? "") === normalizedOption;\n  }\n'''
          if old not in s:
              raise SystemExit('selectedValue block not found')
          s=s.replace(old,new,1)
          s=s.replace('''      const options = Array.isArray(field.options) ? field.options : [];\n      return `<div class="nf-field"><label>${label}</label><select name="${name}" ${field.required ? "required" : ""}><option value="">請選擇</option>${options.map((opt) => `<option value="${esc(opt)}" ${selectedValue(value, opt) ? "selected" : ""}>${esc(opt)}</option>`).join("")}</select></div>`;''','''      const options = (Array.isArray(field.options) ? field.options : []).map(optionText).filter(Boolean);\n      return `<div class="nf-field"><label>${label}</label><select name="${name}" ${field.required ? "required" : ""}><option value="">請選擇</option>${options.map((opt) => `<option value="${esc(opt)}" ${selectedValue(value, opt) ? "selected" : ""}>${esc(opt)}</option>`).join("")}</select></div>`;''',1)
          s=s.replace('''      const options = Array.isArray(field.options) ? field.options : [];\n      return `<div class="nf-field"><label>${label}</label><div class="nf-choice">${options.map((opt) => `<label><input type="radio" name="${name}" value="${esc(opt)}" ${field.required ? "required" : ""} ${selectedValue(value, opt) ? "checked" : ""}>${esc(opt)}</label>`).join("")}</div></div>`;''','''      const options = (Array.isArray(field.options) ? field.options : []).map(optionText).filter(Boolean);\n      return `<div class="nf-field"><label>${label}</label><div class="nf-choice">${options.map((opt) => `<label><input type="radio" name="${name}" value="${esc(opt)}" ${field.required ? "required" : ""} ${selectedValue(value, opt) ? "checked" : ""}>${esc(opt)}</label>`).join("")}</div></div>`;''',1)
          s=s.replace('''      const options = Array.isArray(field.options) ? field.options : [];\n      return `<div class="nf-field" data-checkbox-field="${name}" data-required="${field.required ? "1" : "0"}"><label>${label}</label><div class="nf-choice">${options.map((opt) => `<label><input type="checkbox" name="${name}" value="${esc(opt)}" ${selectedValue(value, opt) ? "checked" : ""}>${esc(opt)}</label>`).join("")}</div></div>`;''','''      const options = (Array.isArray(field.options) ? field.options : []).map(optionText).filter(Boolean);\n      return `<div class="nf-field" data-checkbox-field="${name}" data-required="${field.required ? "1" : "0"}"><label>${label}</label><div class="nf-choice">${options.map((opt) => `<label><input type="checkbox" name="${name}" value="${esc(opt)}" ${selectedValue(value, opt) ? "checked" : ""}>${esc(opt)}</label>`).join("")}</div></div>`;''',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'function optionText(option)' public/native-form.js
          node --check public/native-form.js
      - name: Commit and cleanup
        run: |
          git config user.name 'fangwl591021'
          git config user.email '50135766+fangwl591021@users.noreply.github.com'
          git add public/native-form.js
          git commit -m 'Fix custom registration option display'
          git push origin HEAD:feature/tdea-identity-profile
          git rm .github/workflows/fix-custom-option-display-v2-once.yml
          git commit -m 'Remove one-time custom option workflow'
          git push origin HEAD:feature/tdea-identity-profile
