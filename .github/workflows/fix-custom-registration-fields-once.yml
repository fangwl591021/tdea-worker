name: Fix custom registration fields once
on:
  push:
    paths:
      - '.github/workflows/fix-custom-registration-fields-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')

          anchor='''  function storedFormSettingsForActivity(activity = {}) {\n'''
          helper='''  const defaultRegistrationFieldKeys = new Set(["name","phone","email","company","memberNo","note","participantUnit"]);\n\n  function customRegistrationFieldsFor(activity = {}) {\n    const settings = storedFormSettingsForActivity(activity);\n    const fields = Array.isArray(settings.fields) ? settings.fields : [];\n    return fields.filter((field) => field && !defaultRegistrationFieldKeys.has(String(field.key || "").trim()));\n  }\n\n  function serializeCustomRegistrationFields(activity = {}) {\n    return customRegistrationFieldsFor(activity).map((field) => {\n      const type = String(field.type || "text").trim();\n      const required = field.required ? "必填" : "選填";\n      const options = Array.isArray(field.options) ? field.options.join(",") : "";\n      return [String(field.label || "").trim(), type, required, options].join(" | ");\n    }).filter(Boolean).join("\\n");\n  }\n\n  function parseCustomRegistrationFields(text = "") {\n    return String(text || "").split(/\\r?\\n/).map((line, index) => {\n      const raw = line.trim();\n      if (!raw) return null;\n      const parts = raw.split("|").map((part) => part.trim());\n      const label = parts[0] || "";\n      if (!label) return null;\n      const rawType = (parts[1] || "text").toLowerCase();\n      const type = ["text","email","paragraph","radio","checkbox","dropdown"].includes(rawType) ? rawType : "text";\n      const required = /^(必填|required|y|yes|true|1)$/i.test(parts[2] || "");\n      const options = (parts[3] || "").split(/[,、]/).map((v) => v.trim()).filter(Boolean);\n      const keyBase = `custom_${index + 1}_${label}`.replace(/[^A-Za-z0-9_\\u4e00-\\u9fff]/g, "_").slice(0, 60);\n      return { key: keyBase, label, type, required, ...(options.length ? { options } : {}) };\n    }).filter(Boolean);\n  }\n\n'''
          if anchor not in s:
              raise SystemExit('stored settings anchor not found')
          s=s.replace(anchor,helper+anchor,1)

          old='''      <div class="field"><label>詳細說明</label><textarea name="detailText" placeholder="活動介紹、地點、費用、注意事項...">${esc(activity.detailText || "")}</textarea></div>\n'''
          new='''      <div class="field"><label>詳細說明</label><textarea name="detailText" placeholder="活動介紹、地點、費用、注意事項...">${esc(activity.detailText || "")}</textarea></div>\n      <div class="field"><label>自訂問題</label><textarea name="customRegistrationFields" placeholder="每行一題：問題 | 類型 | 必填/選填 | 選項1,選項2\\n例：是否需要素食 | radio | 必填 | 是,否">${esc(serializeCustomRegistrationFields(activity))}</textarea><div class="muted">類型支援 text、email、paragraph、radio、checkbox、dropdown；選擇題請在第 4 欄填選項。</div></div>\n'''
          if old not in s:
              raise SystemExit('activity detail field anchor not found')
          s=s.replace(old,new,1)

          old2='''        try {\n          const registrationSettings = form.__tdeaRegistrationSettings || null;\n          await ensureNativeFormForActivity(activity, email, registrationSettings, { update: true });\n'''
          new2='''        try {\n          const defaults = nativeFormSettingsFor(activity);\n          const customFields = parseCustomRegistrationFields(d.customRegistrationFields || "");\n          const registrationSettings = { ...(form.__tdeaRegistrationSettings || {}), fields: [...(Array.isArray(defaults.fields) ? defaults.fields : []), ...customFields] };\n          form.__tdeaRegistrationSettings = registrationSettings;\n          await ensureNativeFormForActivity(activity, email, registrationSettings, { update: true });\n'''
          if old2 not in s:
              raise SystemExit('enhanced submit registration settings anchor not found')
          s=s.replace(old2,new2,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          node --check public/app.js
          grep -n '自訂問題' public/app.js
          grep -n 'parseCustomRegistrationFields' public/app.js
          grep -n 'customRegistrationFields' public/app.js
      - name: Commit and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/fix-custom-registration-fields-once.yml .github/workflows/inspect-custom-registration-fields-once.yml
          git config user.name 'fangwl591021'
          git config user.email '50135766+fangwl591021@users.noreply.github.com'
          git add public/app.js .github/workflows
          git commit -m 'Fix custom registration fields in native forms'
          git push origin feature/tdea-identity-profile
