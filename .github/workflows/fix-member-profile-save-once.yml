name: Fix member profile save once
on:
  push:
    branches:
      - feature/tdea-identity-profile
    paths:
      - .github/workflows/fix-member-profile-save-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/fix-member-profile-save.py
      - name: Verify
        shell: bash
        run: |
          node --check public/app.js
          grep -q 'qualification: firstValue(localRow?.qualification' public/app.js
          grep -q '會員資料已更新，背景儲存中' public/app.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add public/app.js
          git commit -m "Keep CRM qualification edits and speed member saves"
          git rm .github/workflows/fix-member-profile-save-once.yml .github/scripts/fix-member-profile-save.py
          git commit -m "Remove one-time member profile save patch files"
          git push origin feature/tdea-identity-profile
