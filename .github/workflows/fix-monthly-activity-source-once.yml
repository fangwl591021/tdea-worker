name: Fix monthly activity source once

on:
  push:
    branches:
      - agent/activity-canonical-create
    paths:
      - .github/workflows/fix-monthly-activity-source-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/activity-canonical-create
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch effective monthly activity source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/monthly-entry.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  const managerData = await readManagerData(env);\n  const activities = Array.isArray(managerData?.activities) ? managerData.activities : [];'''
          new = '''  const managerData = await readManagerData(env);\n  const activitySnapshot = await readActivitySnapshot(env);\n  const activities = Array.isArray(activitySnapshot)\n    ? activitySnapshot\n    : Array.isArray(managerData?.activities) ? managerData.activities : [];'''
          if old not in s:
              raise SystemExit('target snippet not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- src/monthly-entry.ts; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/monthly-entry.ts
          git commit -m 'Use activity snapshot for monthly activity feed'
          git push origin HEAD:agent/activity-canonical-create
