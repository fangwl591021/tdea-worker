name: Fix authoritative native custom field hydration once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: ['.github/workflows/fix-native-custom-hydration-authoritative-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          old='''  async function hydrateCustomRegistrationFieldsFromNativeForm(activity, textarea) {\n    if (!activity || !textarea) return false;\n    const formId = nativeFormIdentifier(activity);\n    if (!formId) return false;\n    const before = textarea.value;\n    try {\n      const response = await fetch(api + "/api/native-forms/" + encodeURIComponent(formId), { headers: adminHeaders(), cache: "no-store" });\n      const result = await response.json().catch(() => ({}));\n      if (!response.ok || !result.success) return false;\n      const data = result.data?.form || result.data || {};\n      const fields = Array.isArray(data.fields) ? data.fields : [];\n      const customText = serializeCustomRegistrationFieldList(fields);\n      if (!customText) return false;\n      if (textarea.value === before) textarea.value = customText;\n      const merged = { ...storedFormSettingsForActivity(activity), fields };\n      state.data.formSettings ||= {};\n      if (activity.id) state.data.formSettings[activity.id] = merged;\n      if (activity.activityNo) state.data.formSettings[activity.activityNo] = merged;\n      activity.formSettings = { ...(activity.formSettings || {}), ...merged };\n      return true;\n    } catch (_) {\n      return false;\n    }\n  }'''
          new='''  async function hydrateCustomRegistrationFieldsFromNativeForm(activity, textarea) {\n    if (!activity || !textarea) return false;\n    const formId = nativeFormIdentifier(activity);\n    if (!formId) return false;\n    try {\n      textarea.dataset.nativeHydrating = "true";\n      const response = await fetch(api + "/api/native-forms/" + encodeURIComponent(formId), { headers: adminHeaders(), cache: "no-store" });\n      const result = await response.json().catch(() => ({}));\n      if (!response.ok || !result.success) throw new Error(result.message || result.error || `自訂問題讀取失敗（HTTP ${response.status}）`);\n      const data = result.data?.form || result.data || {};\n      const fields = Array.isArray(data.fields) ? data.fields : [];\n      const customText = serializeCustomRegistrationFieldList(fields);\n      textarea.value = customText;\n      const merged = { ...storedFormSettingsForActivity(activity), fields };\n      state.data.formSettings ||= {};\n      if (activity.id) state.data.formSettings[activity.id] = merged;\n      if (activity.activityNo) state.data.formSettings[activity.activityNo] = merged;\n      activity.formSettings = { ...(activity.formSettings || {}), ...merged };\n      return true;\n    } catch (error) {\n      textarea.dataset.nativeHydrationError = error?.message || "自訂問題讀取失敗";\n      console.error("custom registration field hydration failed", error);\n      return false;\n    } finally {\n      delete textarea.dataset.nativeHydrating;\n    }\n  }'''
          if old not in s:
              raise SystemExit('hydrate block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Verify
        run: |
          node --check public/app.js
          grep -n -A35 'async function hydrateCustomRegistrationFieldsFromNativeForm' public/app.js
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name fangwl591021
          git config user.email 50135766+fangwl591021@users.noreply.github.com
          git add public/app.js
          git commit -m "Make native form authoritative for custom field hydration"
          git rm .github/workflows/fix-native-custom-hydration-authoritative-once.yml
          git commit -m "Cleanup authoritative custom field hydration workflow"
          git push origin feature/tdea-identity-profile
