name: Fix payment button feedback once
on:
  push:
    paths:
      - '.github/workflows/fix-payment-button-feedback-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          old='document.querySelectorAll("[data-payment-registration]").forEach(b => b.onclick = () => updateRegistrationPayment(b.dataset.paymentRegistration, b.dataset.paymentStatus));'
          new='document.querySelectorAll("[data-payment-registration]").forEach(b => b.onclick = () => updateRegistrationPayment(b.dataset.paymentRegistration, b.dataset.paymentStatus, b));'
          if old not in s: raise SystemExit('payment binding anchor not found')
          s=s.replace(old,new,1)
          old2='''  async function updateRegistrationPayment(registrationId, status) {\n    if (!hasAdminIdentity()) return toast("請先登入管理中心");\n    try {\n      const response = await fetch(api + "/api/native-registrations/payment", {\n        method: "POST",\n        headers: adminHeaders({ "content-type": "application/json" }),\n        body: JSON.stringify({ registrationId, status })\n      });\n      const result = await response.json().catch(() => ({}));\n      if (!response.ok || !result.success) throw new Error(result.message || "付款狀態更新失敗");\n      const activityId = state.drawer?.startsWith("registrations:") ? state.drawer.split(":")[1] : "";\n      if (activityId) await loadRegistrationList(activityId);\n      else render();\n      toast(status === "paid" ? "已確認收款" : "已改回待核對");\n    } catch (err) {\n      toast(err?.message || "付款狀態更新失敗");\n    }\n  }'''
          new2='''  async function updateRegistrationPayment(registrationId, status, button = null) {\n    const originalText = button?.textContent || (status === "paid" ? "確認收款" : "改回待核對");\n    if (button) { button.disabled = true; button.textContent = "處理中…"; }\n    try {\n      const response = await fetch(api + "/api/native-registrations/payment", {\n        method: "POST",\n        headers: adminHeaders({ "content-type": "application/json" }),\n        body: JSON.stringify({ registrationId, status })\n      });\n      const result = await response.json().catch(() => ({}));\n      if (!response.ok || !result.success) throw new Error(result.message || "付款狀態更新失敗");\n      if (button) button.textContent = status === "paid" ? "已收款" : "已改回待核對";\n      const activityId = state.drawer?.startsWith("registrations:") ? state.drawer.split(":")[1] : "";\n      if (activityId) await loadRegistrationList(activityId, true);\n      else render();\n      toast(status === "paid" ? "已確認收款" : "已改回待核對");\n    } catch (err) {\n      if (button) { button.disabled = false; button.textContent = originalText; }\n      alert(err?.message || "付款狀態更新失敗");\n    }\n  }'''
          if old2 not in s: raise SystemExit('payment function anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check public/app.js
          grep -q 'updateRegistrationPayment(b.dataset.paymentRegistration, b.dataset.paymentStatus, b)' public/app.js
          grep -q 'button.textContent = "處理中…"' public/app.js
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/fix-payment-button-feedback-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js .github/workflows/fix-payment-button-feedback-once.yml
          git commit -m 'Fix registration payment action feedback'
          git push origin HEAD:feature/tdea-identity-profile
