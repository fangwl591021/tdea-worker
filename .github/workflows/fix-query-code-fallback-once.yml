name: Fix query code fallback once
on:
  push:
    paths:
      - '.github/workflows/fix-query-code-fallback-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Patch stale code fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/native-form.js')
          s=p.read_text(encoding='utf-8')
          old='''      if (!response.ok || !result.success) {\n        box.innerHTML = `<div class="nf-alert">${esc(result.message || "查無資料")}</div>`;\n        return;\n      }'''
          new='''      if (!response.ok || !result.success) {\n        // Old LINE menu links may still carry a stale query code.\n        // Fall back to the authenticated LINE user's registration list instead of stopping here.\n        if (code) {\n          const url = new URL(location.href);\n          url.searchParams.delete("code");\n          history.replaceState(null, "", url.toString());\n          return runLoginQuery();\n        }\n        box.innerHTML = `<div class="nf-alert">${esc(result.message || "查無資料")}</div>`;\n        return;\n      }'''
          if old not in s:
              raise SystemExit('query failure anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          node --check public/native-form.js
          grep -q 'return runLoginQuery()' public/native-form.js
          grep -q 'url.searchParams.delete("code")' public/native-form.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/native-form.js
          git commit -m 'Fix stale activity query code fallback'
          git push origin HEAD:feature/tdea-identity-profile
          git rm .github/workflows/fix-query-code-fallback-once.yml
          git commit -m 'Remove one-time query fallback workflow'
          git push origin HEAD:feature/tdea-identity-profile
