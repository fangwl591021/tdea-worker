name: Fix query LIFF redirect once
on:
  push:
    paths:
      - '.github/workflows/fix-query-liff-redirect-once.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/native-form.js')
          s=p.read_text(encoding='utf-8')
          old='const liffId = (formId || checkinToken || redeemToken || memberQrMode || calendarMode || marqueeMode || motherRegisterMode) ? "2005868456-cfANNVou" : "2005868456-2jmxqyFU";'
          new='const liffId = (formId || checkinToken || redeemToken || queryMode || memberQrMode || calendarMode || marqueeMode || motherRegisterMode) ? "2005868456-cfANNVou" : "2005868456-2jmxqyFU";'
          if old not in s:
              raise SystemExit('liffId anchor not found')
          s=s.replace(old,new,1)
          old2='window.liff.login({ redirectUri: location.href });'
          new2='''const redirectParams = new URLSearchParams();
            if (queryMode) redirectParams.set("query", "1");
            ["code", "edit", "lineUserId", "uid", "LINE_user_id"].forEach((key) => { const value = trim(params.get(key)); if (value) redirectParams.set(key, value); });
            const redirectUri = queryMode ? `${nativeLiffUrl}?${redirectParams.toString()}` : location.href;
            window.liff.login({ redirectUri });'''
          if old2 not in s:
              raise SystemExit('login redirect anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          node --check public/native-form.js
          grep -q 'redeemToken || queryMode || memberQrMode' public/native-form.js
          grep -q 'const redirectUri = queryMode ?' public/native-form.js
          grep -q 'nativeLiffUrl' public/native-form.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name 'fangwl591021'
          git config user.email 'fangwl591021@users.noreply.github.com'
          git add public/native-form.js
          git commit -m 'Fix activity query LIFF redirect' || true
          git rm .github/workflows/fix-query-liff-redirect-once.yml
          git commit -m 'Remove one-time query LIFF workflow'
          git push origin HEAD:feature/tdea-identity-profile
