name: Fix remittance current activity once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: [.github/workflows/fix-remittance-current-activity-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Inspect exact anchors
        shell: bash
        run: |
          sed -n '2860,2910p' src/monthly-entry.ts
          sed -n '3110,3265p' src/monthly-entry.ts
          sed -n '2680,2770p' public/app.js
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/monthly-entry.ts')
          s=p.read_text(encoding='utf-8')

          # Helper: merge the latest native form activity/payment settings into a registration
          # before it is exposed to member/admin views. The registration keeps member-specific
          # payment state (last5/status/note), while amount/remittance come from current activity.
          anchor='function publicRegistrationEntry(entry: RegistrationEntry) {'
          if anchor not in s:
              raise SystemExit('publicRegistrationEntry anchor not found')
          helper='''async function refreshRegistrationActivitySnapshot(env: Env, entry: RegistrationEntry): Promise<RegistrationEntry> {\n  const formId = clean(entry.formId);\n  if (!formId) return entry;\n  const form = await readNativeForm(env, formId).catch(() => null);\n  const activity = asRecord(form?.activity);\n  if (!activity || !Object.keys(activity).length) return entry;\n  const currentAmount = activityPaymentAmount(activity);\n  const existingPayment = normalizeRegistrationPayment(entry);\n  entry.activity = { ...asRecord(entry.activity), ...activity };\n  entry.payment = {\n    ...existingPayment,\n    amount: currentAmount,\n    status: currentAmount <= 0 ? "free" : (existingPayment.status === "free" ? "unpaid" : existingPayment.status),\n    method: currentAmount <= 0 ? "free" : (existingPayment.method || "bank_transfer"),\n  };\n  return entry;\n}\n\n'''
          s=s.replace(anchor,helper+anchor,1)

          # In member query/list and admin list responses, refresh current activity snapshot before public mapping.
          # Use targeted replacements for common return mapping shapes.
          s=s.replace('data: publicRegistrationEntry(entry)', 'data: publicRegistrationEntry(await refreshRegistrationActivitySnapshot(env, entry))')
          s=s.replace('data: entries.map(publicRegistrationEntry)', 'data: (await Promise.all(entries.map((entry) => refreshRegistrationActivitySnapshot(env, entry)))).map(publicRegistrationEntry)')
          s=s.replace('rows: entries.map(publicRegistrationEntry)', 'rows: (await Promise.all(entries.map((entry) => refreshRegistrationActivitySnapshot(env, entry)))).map(publicRegistrationEntry)')

          p.write_text(s,encoding='utf-8')

          # Backoffice: show current remittance information prominently in registration list,
          # and provide a quick action to open the activity editor where it can be changed once.
          p=Path('public/app.js')
          a=p.read_text(encoding='utf-8')
          old='return `<section class="panel"><div class="panel-head"><h2 class="panel-title">${esc(activity.name || "活動")} 報名名單</h2><div class="actions"><button class="btn" data-export-registrations="${esc(rowId)}">Excel</button><button class="btn" data-refresh-registration-list="${esc(rowId)}">重新載入</button></div></div><div class="table-wrap">'
          new='return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">${esc(activity.name || "活動")} 報名名單</h2>${Number(activity.paymentAmount || 0) > 0 ? `<div class="muted" style="margin-top:8px;white-space:pre-wrap"><strong>報名費：</strong>NT$ ${esc(Number(activity.paymentAmount || 0).toLocaleString())}<br><strong>匯款資訊：</strong>${esc(activity.remittanceInfo || "尚未設定")}</div>` : ""}</div><div class="actions"><button class="btn" data-drawer="activity:${esc(rowId)}">修改活動付款資訊</button><button class="btn" data-export-registrations="${esc(rowId)}">Excel</button><button class="btn" data-refresh-registration-list="${esc(rowId)}">重新載入</button></div></div><div class="table-wrap">'
          if old not in a:
              raise SystemExit('registration list header anchor not found')
          a=a.replace(old,new,1)
          p.write_text(a,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          node --check public/app.js
          npx tsc --noEmit --pretty false 2>/dev/null || true
          grep -q 'refreshRegistrationActivitySnapshot' src/monthly-entry.ts
          grep -q '修改活動付款資訊' public/app.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/monthly-entry.ts public/app.js
          git commit -m "Keep registration remittance info synced with activity"
          git rm .github/workflows/fix-remittance-current-activity-once.yml
          git commit -m "Remove one-time remittance patch workflow"
          git push origin feature/tdea-identity-profile
