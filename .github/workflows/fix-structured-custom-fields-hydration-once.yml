name: Fix structured custom fields hydration once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: ['.github/workflows/fix-structured-custom-fields-hydration-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/form-builder.js')
          s=p.read_text(encoding='utf-8')
          marker='''  async function uploadPoster(file, activityId) {'''
          insert='''  async function hydrateStructuredCustomFieldsFromNativeForm(form, block) {\n    if (!form || !block) return false;\n    try {\n      const data = await loadRemoteActivitiesIntoLocal();\n      const activity = targetActivity(data, form) || {};\n      const formId = String(activity.nativeFormId || activity.formId || activity.id || activity.activityNo || formRowId(form) || "").trim();\n      if (!formId) return false;\n      const response = await fetch(`${apiBase}/api/native-forms/${encodeURIComponent(formId)}`, {\n        headers: adminHeaders(),\n        cache: "no-store"\n      });\n      const result = await response.json().catch(() => ({}));\n      if (!response.ok || !result.success) throw new Error(result.message || `自訂題目讀取失敗（HTTP ${response.status}）`);\n      const native = result.data?.form || result.data || {};\n      const fields = Array.isArray(native.fields) ? native.fields : [];\n      const systemKeys = new Set(["name","phone","email","company","memberNo","note","gender","isMember","meal","imageUpload","participantUnit"]);\n      const customFields = fields.filter(field => field && !systemKeys.has(String(field.key || "").trim()));\n      const list = block.querySelector("[data-custom-fields]");\n      if (!list) return false;\n      list.innerHTML = "";\n      customFields.forEach(field => addCustomField(block, field));\n      return true;\n    } catch (error) {\n      const status = form.querySelector(".form-upload-status");\n      if (status) status.textContent = error?.message || "自訂題目讀取失敗";\n      return false;\n    }\n  }\n\n'''
          if marker not in s:
              raise SystemExit('uploadPoster marker not found')
          s=s.replace(marker, insert+marker, 1)
          old='''    hydrateRegistrationSettings(form, block);\n    submit?.insertAdjacentElement("beforebegin", block);'''
          new='''    hydrateRegistrationSettings(form, block);\n    submit?.insertAdjacentElement("beforebegin", block);\n    hydrateStructuredCustomFieldsFromNativeForm(form, block).catch(() => false);'''
          if old not in s:
              raise SystemExit('hydrate call marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          node --check public/form-builder.js
          grep -n -A35 'hydrateStructuredCustomFieldsFromNativeForm' public/form-builder.js
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name fangwl591021
          git config user.email 50135766+fangwl591021@users.noreply.github.com
          git add public/form-builder.js
          git commit -m "Load structured custom fields from native form"
          git rm .github/workflows/fix-structured-custom-fields-hydration-once.yml
          git commit -m "Cleanup structured custom fields hydration workflow"
          git push origin feature/tdea-identity-profile
