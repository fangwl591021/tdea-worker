name: Fix structured custom field save conflict once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: ['.github/workflows/fix-structured-fields-save-conflict-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          old='''        let registrationSettings = null;\n        try {\n          const defaults = nativeFormSettingsFor(activity);\n          const customFields = parseCustomRegistrationFields(d.customRegistrationFields || "");\n          registrationSettings = { ...(form.__tdeaRegistrationSettings || {}), fields: [...(Array.isArray(defaults.fields) ? defaults.fields : []), ...customFields] };\n          form.__tdeaRegistrationSettings = registrationSettings;'''
          new='''        let registrationSettings = null;\n        try {\n          const defaults = nativeFormSettingsFor(activity);\n          const builderSettings = form.__tdeaRegistrationSettings && typeof form.__tdeaRegistrationSettings === "object" ? form.__tdeaRegistrationSettings : {};\n          const structuredEditorPresent = Boolean(form.querySelector("[data-custom-fields]"));\n          const textareaCustomFields = parseCustomRegistrationFields(d.customRegistrationFields || "");\n          const structuredCustomFields = Array.isArray(builderSettings.customFields) ? builderSettings.customFields : [];\n          const customFields = structuredEditorPresent ? structuredCustomFields : textareaCustomFields;\n          registrationSettings = structuredEditorPresent\n            ? { ...builderSettings, customFields, fields: Array.isArray(builderSettings.fields) ? builderSettings.fields : [...(Array.isArray(defaults.fields) ? defaults.fields : []), ...customFields] }\n            : { ...builderSettings, customFields, fields: [...(Array.isArray(defaults.fields) ? defaults.fields : []), ...customFields] };\n          form.__tdeaRegistrationSettings = registrationSettings;'''
          if old not in s:
              raise SystemExit('target save block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          node --check public/app.js
          grep -n -A18 'const builderSettings' public/app.js
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/app.js
          git commit -m "Preserve structured custom fields on activity save"
          git rm .github/workflows/fix-structured-fields-save-conflict-once.yml
          git commit -m "Remove structured field save fix workflow"
          git push origin HEAD:feature/tdea-identity-profile
