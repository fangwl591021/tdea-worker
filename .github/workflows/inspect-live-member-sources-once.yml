name: Inspect live TDEA member sources once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: [.github/workflows/inspect-live-member-sources-once.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Inspect live APIs
        run: |
          set -euo pipefail
          base='https://tdeawork.fangwl591021.workers.dev'
          email='fangwl591021@gmail.com'
          curl -sS -D /tmp/h1 -H "x-admin-email: $email" "$base/api/aiwe-members-public?inspect=$(date +%s)" -o /tmp/aiwe.json || true
          curl -sS -D /tmp/h2 -H "x-admin-email: $email" "$base/api/general-members?inspect=$(date +%s)" -o /tmp/general.json || true
          python - <<'PY' > .github/live-member-source-result.txt
import json

def load(path):
  try:
    return json.load(open(path,encoding='utf-8'))
  except Exception as e:
    return {'parseError':str(e)}

a=load('/tmp/aiwe.json')
g=load('/tmp/general.json')
print('AIWE_STATUS=' + open('/tmp/h1',encoding='utf-8',errors='ignore').readline().strip())
print('AIWE_SUCCESS=' + str(a.get('success')))
print('AIWE_TOTAL=' + str(a.get('total')))
print('AIWE_MESSAGE=' + str(a.get('message') or a.get('error') or ''))
rows=a.get('data') or []
print('AIWE_B1150011=' + repr([r for r in rows if str(r.get('rosterMemberNo') or r.get('memberNo') or '').upper()=='B1150011'][:2]))
print('GENERAL_STATUS=' + open('/tmp/h2',encoding='utf-8',errors='ignore').readline().strip())
print('GENERAL_SUCCESS=' + str(g.get('success')))
print('GENERAL_MESSAGE=' + str(g.get('message') or g.get('error') or ''))
print('GENERAL_DATA=' + repr(g.get('data'))[:1000])
PY
      - name: Commit result and cleanup
        if: always()
        run: |
          git config user.name fangwl591021
          git config user.email 50135766+fangwl591021@users.noreply.github.com
          git add .github/live-member-source-result.txt
          git rm .github/workflows/inspect-live-member-sources-once.yml
          git commit -m 'Record live member source inspection'
          git push origin feature/tdea-identity-profile
