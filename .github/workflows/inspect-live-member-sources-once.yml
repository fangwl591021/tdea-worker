name: Inspect live TDEA member sources once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: [.github/workflows/inspect-live-member-sources-once.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Inspect live APIs
        run: |
          set -euo pipefail
          base='https://tdeawork.fangwl591021.workers.dev'
          email='fangwl591021@gmail.com'
          echo '=== /api/aiwe-members-public ==='
          curl -sS -D /tmp/h1 -H "x-admin-email: $email" "$base/api/aiwe-members-public?inspect=$(date +%s)" -o /tmp/aiwe.json || true
          head -n 1 /tmp/h1 || true
          python - <<'PY'
import json
p='/tmp/aiwe.json'
try:
 d=json.load(open(p,encoding='utf-8'))
 print('success=',d.get('success'),'total=',d.get('total'),'message=',d.get('message'),'error=',d.get('error'))
 rows=d.get('data') or []
 print('B1150011=',[r for r in rows if str(r.get('rosterMemberNo') or r.get('memberNo') or '').upper()=='B1150011'][:2])
except Exception as e: print('parse_error=',e,open(p,encoding='utf-8',errors='replace').read()[:500])
PY
          echo '=== /api/general-members ==='
          curl -sS -D /tmp/h2 -H "x-admin-email: $email" "$base/api/general-members?inspect=$(date +%s)" -o /tmp/general.json || true
          head -n 1 /tmp/h2 || true
          python - <<'PY'
import json
p='/tmp/general.json'
try:
 d=json.load(open(p,encoding='utf-8'))
 print('success=',d.get('success'),'message=',d.get('message'),'error=',d.get('error'))
 print('data=',str(d.get('data'))[:500])
except Exception as e: print('parse_error=',e,open(p,encoding='utf-8',errors='replace').read()[:500])
PY
      - name: Cleanup
        if: always()
        run: |
          git config user.name fangwl591021
          git config user.email 50135766+fangwl591021@users.noreply.github.com
          git rm .github/workflows/inspect-live-member-sources-once.yml
          git commit -m 'Cleanup live member source inspection' || true
          git push origin feature/tdea-identity-profile
