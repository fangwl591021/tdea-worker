name: Inspect live Nantou native fields once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: ['.github/workflows/inspect-live-nantou-native-fields-once.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Inspect live API
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://tdeawork.fangwl591021.workers.dev'
          aid='id-hgnzatpx4a4msqwwmp9'
          def get(url):
              with urllib.request.urlopen(url, timeout=20) as r:
                  return json.loads(r.read().decode('utf-8'))
          a=get(base+'/api/activities')
          rows=((a.get('data') or {}).get('activities') or [])
          row=next((x for x in rows if x.get('id')==aid),{})
          print('ACTIVITY_FORMSETTINGS', json.dumps((row.get('formSettings') or {}).get('fields') or [], ensure_ascii=False))
          nf=get(base+'/api/native-forms/'+aid)
          data=nf.get('data') or {}
          print('NATIVE_FIELDS', json.dumps(data.get('fields') or [], ensure_ascii=False))
          PY
      - name: Cleanup
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/inspect-live-nantou-native-fields-once.yml
          git commit -m "Remove Nantou native field inspector" || true
          git push origin HEAD:feature/tdea-identity-profile
