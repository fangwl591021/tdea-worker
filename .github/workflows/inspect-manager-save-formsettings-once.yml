name: Inspect manager formSettings save once
on:
  push:
    branches: [feature/tdea-identity-profile]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Inspect save paths
        shell: bash
        run: |
          echo '=== save function ==='
          grep -n -A80 -B30 'function save()\|const save =' public/app.js | head -220 || true
          echo '=== saveManagerDataRemote refs ==='
          grep -n -A80 -B30 'saveManagerDataRemote' public/app.js | head -260 || true
          echo '=== mergeManagerData ==='
          grep -n -A100 -B20 'function mergeManagerData' public/app.js | head -260 || true
          echo '=== stored form settings reads ==='
          grep -n -E 'storedFormSettingsForActivity|formSettings\[activity\.id\]|activity\.formSettings' public/app.js | head -260 || true
