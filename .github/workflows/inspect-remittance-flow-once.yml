name: Inspect remittance flow once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: [.github/workflows/inspect-remittance-flow-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Inspect payment and remittance wiring
        shell: bash
        run: |
          echo '=== APP payment/remittance refs ==='
          grep -n -E 'remittance|paymentAmount|paymentStatus|payment|匯款|末五碼|待核對|已收款|改回待核對' public/app.js | head -260 || true
          echo '=== NATIVE FORM payment/remittance refs ==='
          grep -n -E 'remittance|paymentAmount|paymentStatus|payment|匯款|末五碼|待核對|已收款' public/native-form.js | head -260 || true
          echo '=== WORKER payment/remittance refs ==='
          grep -n -E 'remittance|paymentAmount|paymentStatus|payment|匯款|末五碼|待核對|已收款' src/monthly-entry.ts | head -360 || true
