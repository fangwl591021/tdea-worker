name: Inspect remote custom fields once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: [.github/workflows/inspect-remote-custom-fields-once.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Read remote R2 state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object get assets-bucket/manager/state.json --file manager.json --remote
          npx wrangler r2 object get assets-bucket/activities/index.json --file activity-index.json --remote
          python - <<'PY'
          import json, subprocess, os
          def load(path, default):
              try:
                  with open(path, encoding='utf-8') as f: return json.load(f)
              except Exception as e:
                  print('LOAD_FAIL', path, type(e).__name__, str(e)); return default
          manager=load('manager.json',{})
          fs=manager.get('formSettings') if isinstance(manager,dict) else None
          print('=== MANAGER FORM SETTINGS ===')
          if not isinstance(fs,dict):
              print('formSettings: missing')
          else:
              print('keys:', len(fs))
              for k,v in fs.items():
                  if not isinstance(v,dict): continue
                  fields=v.get('fields')
                  print('KEY',k,'fields',len(fields) if isinstance(fields,list) else 'missing')
                  if isinstance(fields,list):
                      for f in fields:
                          if not isinstance(f,dict): continue
                          opts=f.get('options')
                          print(' FIELD',repr(f.get('label','')), 'type='+str(f.get('type','')), 'options='+str(len(opts) if isinstance(opts,list) else 0))
          ids=load('activity-index.json',[])
          print('=== ACTIVITY RECORDS ===')
          print('count:', len(ids) if isinstance(ids,list) else 'invalid')
          if not isinstance(ids,list): ids=[]
          for aid in ids:
              out='activity.json'
              key='assets-bucket/activities/records/'+str(aid)+'.json'
              p=subprocess.run(['npx','wrangler','r2','object','get',key,'--file',out,'--remote'],text=True,capture_output=True)
              if p.returncode:
                  print('ACTIVITY',aid,'READ_FAIL',p.stderr[-300:]); continue
              row=load(out,{})
              afs=row.get('formSettings') if isinstance(row,dict) else None
              fields=afs.get('fields') if isinstance(afs,dict) else None
              print('ACTIVITY',aid,'name='+repr(row.get('name','')),'formSettings='+str(isinstance(afs,dict)),'fields='+str(len(fields) if isinstance(fields,list) else 'missing'))
              if isinstance(fields,list):
                  for f in fields:
                      if not isinstance(f,dict): continue
                      opts=f.get('options')
                      print(' FIELD',repr(f.get('label','')), 'type='+str(f.get('type','')), 'options='+str(len(opts) if isinstance(opts,list) else 0))
          PY
      - name: Cleanup workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/inspect-remote-custom-fields-once.yml
          git commit -m "Remove remote custom field inspector" || true
          git push origin HEAD:feature/tdea-identity-profile
