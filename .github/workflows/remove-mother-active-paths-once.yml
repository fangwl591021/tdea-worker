name: Remove mother active paths once
on:
  push:
    branches:
      - feature/tdea-identity-profile
    paths:
      - .github/workflows/remove-mother-active-paths-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/remove-mother-active-paths.py
      - name: Verify
        shell: bash
        run: |
          node --check public/app.js
          ! grep -q 'loadMotherRosterMap' public/app.js
          ! grep -q 'data-sync-mother-register' public/app.js
          ! grep -q 'field("母站帳號"' public/app.js
          ! grep -q 'rosterSync = syncRosterMemberToWorker' public/app.js
          grep -q 'qualification: firstValue(localRow?.qualification' public/app.js
          grep -q 'const lineUserId = info ? memberLineUid(info.row)' public/app.js
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add public/app.js
          git commit -m "Remove mother data paths from active TDEA CRM"
          git rm .github/workflows/remove-mother-active-paths-once.yml .github/scripts/remove-mother-active-paths.py
          git commit -m "Remove one-time mother decoupling patch files"
          git push origin feature/tdea-identity-profile
