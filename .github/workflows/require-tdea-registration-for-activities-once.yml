name: Require TDEA registration for activities once
on:
  push:
    branches:
      - feature/tdea-identity-profile
    paths:
      - .github/workflows/require-tdea-registration-for-activities-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply focused registration gate patch
        run: python .github/scripts/patch-registration-gate.py
      - name: Verify focused registration gate
        shell: bash
        run: |
          node --check public/native-form.js
          python - <<'PY'
          from pathlib import Path
          b = Path('src/monthly-entry.ts').read_bytes()
          a = Path('public/native-form.js').read_text(encoding='utf-8')
          assert b'resolveTdeaRegisteredIdentity' in b
          assert b'code: "registration_required"' in b
          assert b'"tdea_registered"' in b
          assert b'async function createNativeRegistration' in b
          assert '確認 TDEA 會員註冊狀態' in a
          assert 'isRegistrationProfileField' in a
          assert '立即註冊' in a
          assert 'activityFields.map(fieldHtml)' in a
          print('TDEA registration gate verification passed')
          PY
          git diff --check || true
      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/monthly-entry.ts public/native-form.js
          git commit -m "Require registered TDEA identity for activity signup"
          git rm .github/workflows/require-tdea-registration-for-activities-once.yml .github/scripts/patch-registration-gate.py
          git commit -m "Remove one-time activity registration patch files"
          git push origin feature/tdea-identity-profile
