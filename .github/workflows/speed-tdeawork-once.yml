name: Speed tdeawork once
on:
  push:
    branches:
      - feature/tdea-identity-profile
    paths:
      - .github/workflows/speed-tdeawork-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/speed-tdeawork.py
      - name: Verify
        shell: bash
        run: |
          node --check public/native-form.js
          python - <<'PY'
          from pathlib import Path
          b = Path('src/monthly-entry.ts').read_bytes()
          a = Path('public/native-form.js').read_text(encoding='utf-8')
          assert b'/internal/tdea/member/' in b
          assert b'points/adjust?compact=1' in b
          assert b'result.balance ?? wallet.balance' in b
          assert 'const formPromise = fetch(' in a
          assert 'Promise.all([formPromise, uidPromise])' in a
          print('tdeawork speed patch verified')
          PY
          git diff --check || true
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "fangwl591021"
          git config user.email "50135766+fangwl591021@users.noreply.github.com"
          git add src/monthly-entry.ts public/native-form.js
          git commit -m "Speed activity identity and point adjustments"
          git rm .github/workflows/speed-tdeawork-once.yml .github/scripts/speed-tdeawork.py
          git commit -m "Remove one-time tdeawork speed patch files"
          git push origin feature/tdea-identity-profile