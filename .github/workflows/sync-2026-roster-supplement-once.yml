name: Sync 2026 roster supplement once
on:
  push:
    branches: [feature/tdea-identity-profile]
    paths: ['.github/workflows/sync-2026-roster-supplement-once.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Add missing 2026 roster members
        shell: python
        run: |
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path("public/roster.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          additions = [['Z1150001', '設計師', '郭珮汝', '', 'Y', ''], ['A1140001', '設計師', '余政道', '', 'Y', ''], ['A1140002', '設計師', '呂讚峰', '', 'Y', ''], ['A1140003', '設計師', '向玉婷', '', 'Y', ''], ['A1140004', '設計師', '楊婷雅', '', 'Y', ''], ['A1140005', '設計師', '黃蕙汶', '', 'Y', ''], ['B1140006', '準會員', '徐維德', '', 'Y', ''], ['A1140007', '設計師', '張元維', '', 'Y', ''], ['A1140008', '設計師', '牛漢傑', '', 'Y', ''], ['A1140009', '設計師', '游佳瑜', '', 'Y', ''], ['A1140010', '設計師', '郭麗虹', '', 'Y', ''], ['A1140011', '設計師', '李澤沅', '', 'Y', ''], ['B1140012', '準會員', '薛富源', '', 'Y', ''], ['A1140013', '設計師', '陳奕璇', '', 'Y', ''], ['A1140014', '設計師', '尤秀銀', '', 'Y', ''], ['A1140015', '設計師', '宋泓諭', '', 'Y', ''], ['A1140016', '設計師', '邱勝杰', '', 'Y', ''], ['A1140017', '設計師', '陳鈺同', '', 'Y', ''], ['A1140018', '設計師', '王皓榆', '', 'Y', ''], ['A1140019', '設計師', '廖子娛', '', 'Y', ''], ['A1140020', '設計師', '林靜怡', '', 'Y', ''], ['A1140021', '設計師', '張瑜舫', '', 'Y', ''], ['A1140022', '設計師', '朱庭儀', '', 'Y', ''], ['A1150001', '設計師', '戴敏華', '', 'Y', ''], ['A1150002', '設計師', '張子鍵', '', 'Y', ''], ['A1150003', '設計師', '李奇錦', '', 'Y', ''], ['A1150004', '設計師', '何瑞洋', '', 'Y', ''], ['A1150005', '設計師', '李瑞昕', '', 'Y', ''], ['A1150006', '設計師', '何家榮', '', 'Y', ''], ['A1150007', '設計師', '林忠良', '', 'Y', ''], ['A1150008', '設計師', '張玉屏', '', 'Y', ''], ['A1150009', '設計師', '吳寶懿', '', 'Y', ''], ['B1150010', '準會員', '李冠明', '', 'Y', ''], ['B1150011', '準會員', '童子恩', '', 'Y', ''], ['B1150012', '準會員', '楊沛駥', '', 'Y', ''], ['A1150013', '設計師', '林育瑄', '', 'Y', ''], ['B1150014', '準會員', '陳美靜', '', 'Y', ''], ['A1150015', '設計師', '林姸希', '', 'Y', ''], ['A1150016', '設計師', '王紹宇', '', 'Y', '']]
          rows = data.get("a")
          if not isinstance(rows, list):
              raise SystemExit("association roster missing")
          existing = {str(row[0]).strip().upper() for row in rows if isinstance(row, list) and row}
          added = []
          for row in additions:
              member_no = str(row[0]).strip().upper()
              if member_no in existing:
                  continue
              rows.append(row)
              existing.add(member_no)
              added.append(row)
          data["updatedAt"] = datetime.now(timezone.utc).isoformat()
          data["supplementSource"] = "Google Sheet 1mDfGpaK8f2jCIydiDPWnDlOxzbn72X9Mq9CukZ8qtns / 2026-名單"
          data["supplementRowsAdded"] = len(added)
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print("ADDED", len(added))
          for row in added:
              print(row[0], row[2])
          if not any(str(row[0]).upper() == "B1150011" and row[2] == "童子恩" for row in rows if isinstance(row, list) and len(row) > 2):
              raise SystemExit("B1150011 童子恩 missing after sync")
      - name: Verify roster JSON
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('public/roster.json','utf8'));const r=d.a.find(x=>x[0]==='B1150011');if(!r||r[2]!=='童子恩')process.exit(1);console.log('B1150011',r);"
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name fangwl591021
          git config user.email 50135766+fangwl591021@users.noreply.github.com
          git add public/roster.json
          git commit -m "Refresh TDEA 2026 association roster"
          git rm .github/workflows/sync-2026-roster-supplement-once.yml
          git commit -m "Cleanup one-time 2026 roster sync"
          git push origin feature/tdea-identity-profile
