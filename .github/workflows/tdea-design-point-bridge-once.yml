name: Wire TDEA-DESIGN point service once

on:
  push:
    branches:
      - fix/tdea-local-points-core
    paths:
      - .github/workflows/tdea-design-point-bridge-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tdea-local-points-core
          fetch-depth: 0

      - name: Patch only point bridge core
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/monthly-entry.ts')
          data = path.read_bytes()

          env_old = b'type Env = { ADMIN_EMAILS?: string;'
          env_new = b'type Env = { TDEA_DESIGN?: Fetcher; TDEA_INTERNAL_SECRET?: string; ADMIN_EMAILS?: string;'
          if data.count(env_old) != 1:
              raise SystemExit(f'env target count={data.count(env_old)}')
          data = data.replace(env_old, env_new, 1)

          get_pattern = re.compile(
              rb'async function getUnifiedPointAccount\(env: Env, lineUserId: string, options: \{ autoImport\?: boolean \} = \{\}\) \{.*?\r?\n\}\r?\n(?=\r?\nasync function syncCheckinPoints)',
              re.S,
          )
          get_replacement = '''async function getUnifiedPointAccount(env: Env, lineUserId: string, options: { autoImport?: boolean } = {}) {\r\n  void options;\r\n  if (!lineUserId) return { success: false, balance: 0, logs: [], message: "Missing LINE UID" };\r\n  if (!env.TDEA_DESIGN || !env.TDEA_INTERNAL_SECRET) return { success: false, balance: 0, logs: [], message: "TDEA-DESIGN point service is not configured" };\r\n  const response = await env.TDEA_DESIGN.fetch(`https://tdea-design.internal/internal/tdea/points/${encodeURIComponent(lineUserId)}`, {\r\n    method: "GET",\r\n    headers: { "x-tdea-internal-secret": env.TDEA_INTERNAL_SECRET, accept: "application/json" }\r\n  });\r\n  const result = await response.json().catch(() => ({})) as Record<string, unknown>;\r\n  if (!response.ok || result.success !== true) return { success: false, balance: 0, logs: [], message: clean(result.error) || "TDEA-DESIGN point query failed" };\r\n  const entries = Array.isArray(result.entries) ? result.entries.map(asRecord) : [];\r\n  const logs: PointLog[] = entries.map((entry, index) => {\r\n    const amount = numberValue(entry.delta);\r\n    const createdAt = clean(entry.created_at);\r\n    return {\r\n      logId: clean(entry.id) || `${lineUserId}:${index}:${createdAt}`,\r\n      lineUserId,\r\n      type: amount >= 0 ? "EARN" : "SPEND",\r\n      amount,\r\n      points: Math.abs(amount),\r\n      reason: clean(entry.event_type) || "TDEA points",\r\n      balanceAfter: numberValue(entry.balance_after),\r\n      createdAt,\r\n      createdTs: Date.parse(createdAt) || 0,\r\n      source: "tdea-design-d1",\r\n      referenceId: clean(entry.event_reference)\r\n    };\r\n  });\r\n  return { success: true, balance: numberValue(result.balance), logs, source: "tdea-design-d1", userId: clean(result.userId) };\r\n}\r\n'''.encode('utf-8')

          update_pattern = re.compile(
              rb'async function updateLocalPoints\(env: Env, lineUserId: string, amount: number, reason: string, options: \{ source\?: string; referenceId\?: string; skipExternalSync\?: boolean \} = \{\}\) \{.*?\r?\n\}\r?\n(?=\r?\nfunction taipeiDateKey)',
              re.S,
          )
          update_replacement = '''async function updateLocalPoints(env: Env, lineUserId: string, amount: number, reason: string, options: { source?: string; referenceId?: string; skipExternalSync?: boolean } = {}) {\r\n  void options.skipExternalSync;\r\n  const numericAmount = Number(amount || 0);\r\n  if (!lineUserId || !numericAmount) return { success: false, message: "Missing LINE UID or point amount" };\r\n  if (!env.TDEA_DESIGN || !env.TDEA_INTERNAL_SECRET) return { success: false, message: "TDEA-DESIGN point service is not configured" };\r\n  const requestId = clean(options.referenceId) || (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);\r\n  const response = await env.TDEA_DESIGN.fetch("https://tdea-design.internal/internal/tdea/points/adjust", {\r\n    method: "POST",\r\n    headers: { "content-type": "application/json", "x-tdea-internal-secret": env.TDEA_INTERNAL_SECRET },\r\n    body: JSON.stringify({\r\n      lineUserId,\r\n      action: numericAmount < 0 ? "deduct" : "grant",\r\n      points: Math.abs(numericAmount),\r\n      note: clean(reason) || clean(options.source) || "TDEA point adjustment",\r\n      requestId\r\n    })\r\n  });\r\n  const result = await response.json().catch(() => ({})) as Record<string, unknown>;\r\n  if (!response.ok || result.success !== true) return { success: false, message: clean(result.error) || "TDEA-DESIGN point adjustment failed", code: response.status === 400 ? "point_adjust_failed" : "point_service_failed" };\r\n  const wallet = asRecord(result.wallet);\r\n  const adjustment = asRecord(result.result);\r\n  const entry = asRecord(adjustment.entry);\r\n  const balanceAfter = numberValue(wallet.balance || entry.balanceAfter || entry.balance_after);\r\n  const createdTs = Date.now();\r\n  const log: PointLog = {\r\n    logId: clean(entry.id) || requestId,\r\n    lineUserId,\r\n    type: numericAmount >= 0 ? "EARN" : "SPEND",\r\n    amount: numericAmount,\r\n    points: Math.abs(numericAmount),\r\n    reason,\r\n    balanceAfter,\r\n    createdAt: new Date(createdTs).toISOString(),\r\n    createdTs,\r\n    source: options.source || "tdea-design-d1",\r\n    referenceId: requestId\r\n  };\r\n  return { success: true, balance: balanceAfter, log, account: { balance: balanceAfter, logs: [log], source: "tdea-design-d1" }, serviceResult: result };\r\n}\r\n'''.encode('utf-8')

          data2, count1 = get_pattern.subn(get_replacement, data, count=1)
          data3, count2 = update_pattern.subn(update_replacement, data2, count=1)
          if count1 != 1 or count2 != 1:
              raise SystemExit(f'point function target mismatch get={count1} update={count2}')
          path.write_bytes(data3)
          PY

      - name: Verify target bridge only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          data = Path('src/monthly-entry.ts').read_bytes()
          get_body = re.search(rb'async function getUnifiedPointAccount\(.*?\r?\n\}\r?\n(?=\r?\nasync function syncCheckinPoints)', data, re.S)
          update_body = re.search(rb'async function updateLocalPoints\(.*?\r?\n\}\r?\n(?=\r?\nfunction taipeiDateKey)', data, re.S)
          if not get_body or not update_body:
              raise SystemExit('target function not found')
          for name, body in [('get', get_body.group()), ('update', update_body.group())]:
              if b'TDEA_DESIGN.fetch' not in body:
                  raise SystemExit(f'{name} bridge missing')
              for forbidden in [b'ASSETS_BUCKET', b'queryPointBalance', b'insertMemberPoint', b'motherPointApiReady']:
                  if forbidden in body:
                      raise SystemExit(f'{name} still contains {forbidden!r}')
          print('point bridge verification passed')
          PY
          git diff --stat

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/monthly-entry.ts
          git rm .github/workflows/tdea-design-point-bridge-once.yml
          git commit -m 'Use TDEA-DESIGN as point source of truth'
          git push origin HEAD:fix/tdea-local-points-core
