name: Apply TDEA local checkin points once

on:
  push:
    branches:
      - fix/tdea-local-points-core
    paths:
      - .github/workflows/tdea-local-checkin-points-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tdea-local-points-core
          fetch-depth: 0

      - name: Patch syncCheckinPoints only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/monthly-entry.ts')
          data = path.read_bytes()

          pattern = re.compile(
              rb'async function syncCheckinPoints\(env: Env, entry: RegistrationEntry\) \{.*?\r?\n\}\r?\n(?=\r?\nasync function readRedeem)',
              re.S,
          )

          replacement = '''async function syncCheckinPoints(env: Env, entry: RegistrationEntry) {\r\n  const activity = asRecord(entry.activity);\r\n  const answers = asRecord(entry.answers);\r\n  const lineUserId = firstClean(entry.lineUserId, answers.LINE_user_id, answers.lineUserId, answers.line_user_id, answers.uid, answers.UID);\r\n  if (!lineUserId) return [{ success: false, code: "missing_line_user_id", message: "registration has no LINE user id" }];\r\n\r\n  const eventName = firstClean(activity.name, activity.activityNo, "TDEA 活動簽到");\r\n  const eventContent = firstClean(activity.courseTime, activity.activityNo, entry.id);\r\n  const checkinPoints = numberValue(activity.checkinPoints || activity.checkinPointAmount);\r\n  const feePoints = numberValue(activity.feePoints || activity.feePointAmount);\r\n  const jobs: Array<{ label: string; points: number }> = [];\r\n  if (checkinPoints > 0) jobs.push({ label: "簽到贈點", points: checkinPoints });\r\n  if (feePoints > 0) jobs.push({ label: "報名扣點", points: -Math.abs(feePoints) });\r\n  if (!jobs.length) return [];\r\n\r\n  const results = [];\r\n  for (const job of jobs) {\r\n    results.push(await updateLocalPoints(\r\n      env,\r\n      lineUserId,\r\n      job.points,\r\n      `${eventName} ${job.label}${eventContent ? `｜${eventContent}` : ""}`,\r\n      { source: "activity_checkin", referenceId: entry.id }\r\n    ));\r\n  }\r\n  return results;\r\n}\r\n'''.encode('utf-8')

          updated, count = pattern.subn(replacement, data, count=1)
          if count != 1:
              raise SystemExit(f'patch target mismatch: syncCheckinPoints={count}')
          path.write_bytes(updated)
          print('patched syncCheckinPoints=1')
          PY

      - name: Verify checkin-only diff
        shell: bash
        run: |
          git diff --stat
          git diff -- src/monthly-entry.ts | sed -n '1,220p'
          added="$(git diff --unified=0 -- src/monthly-entry.ts | grep '^+' | grep -v '^+++')"
          if printf '%s\n' "$added" | grep -E 'insertMemberPoint|queryPointBalance'; then exit 1; fi
          if ! grep -A40 'async function syncCheckinPoints' src/monthly-entry.ts | grep -q 'updateLocalPoints'; then exit 1; fi

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/monthly-entry.ts
          git rm .github/workflows/tdea-local-checkin-points-once.yml
          git commit -m 'Use local points for activity checkin'
          git push origin HEAD:fix/tdea-local-points-core
