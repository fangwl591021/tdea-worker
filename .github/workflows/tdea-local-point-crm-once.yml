name: Apply TDEA local CRM points once

on:
  push:
    branches:
      - fix/tdea-local-points-core
    paths:
      - .github/workflows/tdea-local-point-crm-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tdea-local-points-core
          fetch-depth: 0

      - name: Patch CRM point panel only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/app.js')
          data = path.read_bytes()

          replacements = [
            ('正在比對母站綁定名冊...', '正在比對會員 LINE UID...'),
            ('本地名冊沒有 LINE UID，且母站綁定名冊尚未回補成功。', '本地名冊尚未取得 LINE UID，請先完成會員 LINE 綁定。'),
            ('正在讀取母站點數...', '正在讀取本地點數...'),
            ('母站點數讀取失敗', '本地點數讀取失敗'),
            ('母站綁定名冊查無此會員 LINE UID', '會員名冊查無此會員 LINE UID'),
            ('此操作會寫入母站點數。', '此操作會直接異動 TDEA 本地點數。'),
          ]

          for old, new in replacements:
            oldb, newb = old.encode('utf-8'), new.encode('utf-8')
            count = data.count(oldb)
            if count < 1:
              raise SystemExit(f'missing target: {old}')
            data = data.replace(oldb, newb)
            print(f'replaced {old!r}: {count}')

          old_call = b'    await loadPointLedger(false);\n'
          if data.count(old_call) != 1:
            raise SystemExit(f'loadPointLedger target count={data.count(old_call)}')
          data = data.replace(old_call, b'', 1)
          path.write_bytes(data)
          PY

      - name: Verify CRM-only diff
        shell: bash
        run: |
          git diff --stat
          git diff -- public/app.js | sed -n '1,220p'
          if grep -q '此操作會寫入母站點數' public/app.js; then exit 1; fi
          if grep -q '正在讀取母站點數' public/app.js; then exit 1; fi

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git rm .github/workflows/tdea-local-point-crm-once.yml
          git commit -m 'Use TDEA local points in CRM panel'
          git push origin HEAD:fix/tdea-local-points-core
