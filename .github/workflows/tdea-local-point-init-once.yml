name: Apply TDEA local point initialization once

on:
  push:
    branches:
      - fix/tdea-local-points-core
    paths:
      - .github/workflows/tdea-local-point-init-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tdea-local-points-core
          fetch-depth: 0

      - name: Patch getUnifiedPointAccount only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/monthly-entry.ts')
          data = path.read_bytes()

          pattern = re.compile(
              rb'async function getUnifiedPointAccount\(env: Env, lineUserId: string, options: \{ autoImport\?: boolean \} = \{\}\) \{.*?\r?\n\}\r?\n(?=\r?\nasync function syncCheckinPoints)',
              re.S,
          )

          replacement = '''async function getUnifiedPointAccount(env: Env, lineUserId: string, options: { autoImport?: boolean } = {}) {\r\n  void options;\r\n  if (!lineUserId) return { success: false, balance: 0, logs: [], message: "Missing LINE UID" };\r\n  if (!env.ASSETS_BUCKET) return { success: false, balance: 0, logs: [], message: "R2 bucket is not configured" };\r\n  const key = `points/accounts/${encodeURIComponent(lineUserId)}.json`;\r\n  const object = await env.ASSETS_BUCKET.get(key);\r\n  const stored = object ? await object.json().catch(() => null) as PointAccount | null : null;\r\n  if (stored) {\r\n    const balance = Number.isFinite(Number(stored.balance)) ? Number(stored.balance) : 0;\r\n    const logs = Array.isArray(stored.logs) ? stored.logs : [];\r\n    return { success: true, balance, logs, imported: null, legacySynced: null, motherSynced: null, source: "tdea-local", updatedAt: stored.updatedAt || "" };\r\n  }\r\n  const managerData = await readManagerDataRaw(env).catch(() => null);\r\n  const targetUid = lineUserId.toLowerCase();\r\n  const rosterRows = [\r\n    ...(Array.isArray(managerData?.association) ? managerData!.association as Array<Record<string, unknown>> : []),\r\n    ...(Array.isArray(managerData?.vendor) ? managerData!.vendor as Array<Record<string, unknown>> : [])\r\n  ];\r\n  const roster = rosterRows.find((row) => firstClean(explicitMemberLineUid(row), memberLineUid(row)).toLowerCase() === targetUid);\r\n  const hasImportedBalance = Boolean(roster && Object.prototype.hasOwnProperty.call(roster, "pointBalance") && Number.isFinite(Number(roster.pointBalance)));\r\n  const initialBalance = hasImportedBalance ? Number(roster!.pointBalance) : 0;\r\n  if (!hasImportedBalance) return { success: true, balance: 0, logs: [], imported: null, legacySynced: null, motherSynced: null, source: "tdea-local", updatedAt: "" };\r\n  const createdTs = Date.now();\r\n  const log: PointLog = {\r\n    logId: crypto.randomUUID ? crypto.randomUUID() : String(createdTs),\r\n    lineUserId,\r\n    type: "EARN",\r\n    amount: initialBalance,\r\n    points: Math.abs(initialBalance),\r\n    reason: "名冊點數初始化",\r\n    balanceAfter: initialBalance,\r\n    createdAt: new Date(createdTs).toISOString(),\r\n    createdTs,\r\n    source: "roster-import",\r\n    referenceId: firstClean(roster?.memberNo, roster?.rosterMemberNo)\r\n  };\r\n  const account: PointAccount = { balance: initialBalance, logs: [log], updatedAt: new Date(createdTs).toISOString(), source: "tdea-local" };\r\n  await env.ASSETS_BUCKET.put(key, JSON.stringify(account, null, 2), { httpMetadata: { contentType: "application/json; charset=utf-8", cacheControl: "no-store" } });\r\n  return { success: true, balance: initialBalance, logs: account.logs, imported: { source: "roster-import", balance: initialBalance }, legacySynced: null, motherSynced: null, source: "tdea-local", updatedAt: account.updatedAt };\r\n}\r\n'''.encode('utf-8')

          updated, count = pattern.subn(replacement, data, count=1)
          if count != 1:
              raise SystemExit(f'patch target mismatch: getUnifiedPointAccount={count}')
          path.write_bytes(updated)
          print('patched getUnifiedPointAccount=1')
          PY

      - name: Verify target-only diff
        shell: bash
        run: |
          git diff --stat
          git diff -- src/monthly-entry.ts | sed -n '1,220p'
          grep -A45 'async function getUnifiedPointAccount' src/monthly-entry.ts
          if grep -A45 'async function getUnifiedPointAccount' src/monthly-entry.ts | grep -E 'queryPointBalance|motherPointApiReady|insertMemberPoint'; then exit 1; fi

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/monthly-entry.ts
          git rm .github/workflows/tdea-local-point-init-once.yml
          git commit -m 'Initialize local point account from CRM roster balance'
          git push origin HEAD:fix/tdea-local-points-core
