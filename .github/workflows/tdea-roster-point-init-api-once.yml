name: Add roster point initialization API once

on:
  push:
    branches:
      - fix/tdea-local-points-core
    paths:
      - .github/workflows/tdea-roster-point-init-api-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tdea-local-points-core
          fetch-depth: 0

      - name: Patch roster initialization API only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/monthly-entry.ts')
          data = path.read_bytes()

          anchor = b'async function adjustMemberPointApi(request: Request, env: Env) {'
          if data.count(anchor) != 1:
              raise SystemExit(f'adjustMemberPointApi anchor count={data.count(anchor)}')

          fn = '''async function initializeRosterPointsApi(request: Request, env: Env) {\r\n  const guard = await requireAdmin(request, env);\r\n  if (guard) return guard;\r\n  if (!env.TDEA_DESIGN || !env.TDEA_INTERNAL_SECRET) return json({ success: false, message: "TDEA-DESIGN point service is not configured" }, 503);\r\n  const managerData = await readManagerDataRaw(env);\r\n  if (!managerData) return json({ success: false, message: "CRM 名冊尚未建立" }, 404);\r\n  const rows = [\r\n    ...(Array.isArray(managerData.association) ? managerData.association as Array<Record<string, unknown>> : []),\r\n    ...(Array.isArray(managerData.vendor) ? managerData.vendor as Array<Record<string, unknown>> : [])\r\n  ];\r\n  const members = rows.map((row) => ({\r\n    memberNo: firstClean(row.memberNo, row.rosterMemberNo, row["會員編號"]),\r\n    lineUserId: firstClean(explicitMemberLineUid(row), memberLineUid(row)),\r\n    name: firstClean(row.name, row.rosterName, row["姓名"]),\r\n    phone: firstClean(row.phone, row.mobile, row.tel, row["手機"]),\r\n    email: firstClean(row.email, row.mail, row["email"]),\r\n    pointBalance: Object.prototype.hasOwnProperty.call(row, "pointBalance") ? Number(row.pointBalance) : null\r\n  }));\r\n  const response = await env.TDEA_DESIGN.fetch("https://tdea-design.internal/internal/tdea/points/initialize", {\r\n    method: "POST",\r\n    headers: {\r\n      "content-type": "application/json",\r\n      "x-tdea-internal-secret": env.TDEA_INTERNAL_SECRET\r\n    },\r\n    body: JSON.stringify({ members })\r\n  });\r\n  const result = await response.json().catch(() => ({})) as Record<string, unknown>;\r\n  if (!response.ok || result.success !== true) return json({ success: false, message: clean(result.error) || "TDEA-DESIGN 名冊點數初始化失敗", detail: result }, response.status || 502);\r\n  return json({ success: true, rosterCount: rows.length, data: result });\r\n}\r\n\r\n'''.encode('utf-8')
          data = data.replace(anchor, fn + anchor, 1)

          route = b'\t    if (request.method === "POST" && url.pathname === "/api/points/adjust") return adjustMemberPointApi(request, env);'
          if data.count(route) != 1:
              raise SystemExit(f'point adjust route count={data.count(route)}')
          new_route = b'\t    if (request.method === "POST" && url.pathname === "/api/points/initialize-roster") return initializeRosterPointsApi(request, env);\r\n' + route
          data = data.replace(route, new_route, 1)

          path.write_bytes(data)
          PY

      - name: Verify minimal patch
        shell: bash
        run: |
          grep -q 'async function initializeRosterPointsApi' src/monthly-entry.ts
          grep -q '/api/points/initialize-roster' src/monthly-entry.ts
          git diff --stat
          npx wrangler deploy --dry-run

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/monthly-entry.ts
          git rm .github/workflows/tdea-roster-point-init-api-once.yml
          git commit -m 'Add safe roster point initialization API'
          git push origin HEAD:fix/tdea-local-points-core
