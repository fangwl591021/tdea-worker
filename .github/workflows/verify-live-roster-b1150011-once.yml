name: Verify live roster B1150011 once

on:
  push:
    branches:
      - feature/tdea-identity-profile

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tdea-identity-profile
      - name: Verify production roster
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --retry-delay 1 \
            -H 'Cache-Control: no-cache' \
            'https://tdeawork.fangwl591021.workers.dev/roster.json?verify=20260817' \
            -o /tmp/roster.json
          python - <<'PY'
          import json
          p='/tmp/roster.json'
          data=json.load(open(p, encoding='utf-8'))
          rows=data.get('a') or []
          matches=[r for r in rows if isinstance(r,list) and r and str(r[0]).upper()=='B1150011']
          print('updatedAt=', data.get('updatedAt'))
          print('matches=', matches)
          if not matches:
              raise SystemExit('B1150011 missing from live roster')
          if str(matches[0][2]).strip() != '童子恩':
              raise SystemExit('B1150011 name mismatch')
          print('LIVE_ROSTER_OK')
          PY
      - name: Cleanup one-time workflow
        if: always()
        run: |
          git config user.name fangwl591021
          git config user.email 50135766+fangwl591021@users.noreply.github.com
          git rm .github/workflows/verify-live-roster-b1150011-once.yml
          git commit -m "Cleanup live roster verification workflow" || true
          git push origin feature/tdea-identity-profile
