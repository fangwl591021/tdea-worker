<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDEA 管理中心</title>
  <link rel="stylesheet" href="styles.css?v=layout6">
  <link rel="stylesheet" href="sidebar.css?v=admin-avatar1">
  <link rel="stylesheet" href="smart-activity.css?v=v2split2">
  <link rel="stylesheet" href="smart-activity-compact.css?v=compact2">
  <link rel="stylesheet" href="smart-activity-docs.css?v=docs1">
  <link rel="stylesheet" href="smart-activity-points.css?v=points1">
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const publicKeys = ["cardCollection", "register", "query", "memberQr", "calendar", "checkin", "redeem", "redeemSession", "monthlyDetail", "personalMessages", "close", "marquee", "motherRegister", "memberHome"];
      const params = new URLSearchParams(location.search);
      const state = params.get("liff.state");
      if (state) {
        try {
          new URLSearchParams(decodeURIComponent(state).replace(/^\?/, "")).forEach((value, key) => {
            if (!params.has(key)) params.set(key, value);
          });
        } catch (_) {}
      }
      const isPublicMode = publicKeys.some((key) => params.has(key));
      if (!isPublicMode) return;
      const app = document.getElementById("app");
      if (!app) return;
      app.innerHTML = '<main data-public-fallback style="max-width:840px;margin:0 auto;padding:24px 16px;font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif"><section style="background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:18px;color:#067647;font-weight:800">載入中...</section></main>';
      setTimeout(() => {
        if (!app.querySelector("[data-public-fallback]")) return;
        if (document.querySelector('script[src*="native-form.js"]')) return;
        const script = document.createElement("script");
        script.src = "/native-form.js?v=registration-quick1";
        script.onerror = () => {
          app.innerHTML = '<main style="max-width:840px;margin:0 auto;padding:24px 16px;font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif"><section style="background:#fff3f0;border:1px solid #fecdca;border-radius:10px;padding:18px;color:#b42318;font-weight:800">核銷頁載入失敗，請重新掃描 QR。</section></main>';
        };
        document.body.appendChild(script);
      }, 1600);
    })();
  </script>
  <script src="/registration-total-preview.js?v=total-preview1"></script>
  <script src="/registration-attachment-fix.js?v=attachment-fix3"></script>
  <script src="/custom-line-id-field-fix.js?v=line-id-fix1"></script>
  <script src="/custom-id-card-field-fix.js?v=id-card-fix1"></script>
  <script src="/manager-save-optimizer.js?v=save-opt2"></script>
  <script src="/card-ocr-progress.js?v=ocr-progress1"></script>
  <script src="/admin-login.js?v=admin-entry24"></script>
  <script src="/member-name-search.js?v=name-roster1"></script>
  <script src="/roster-single-entry-only.js?v=single-entry1"></script>
  <script src="/member-single-crud.js?v=single-crud1"></script>
  <script src="/roster-anomaly-list.js?v=anomaly1"></script>
  <script src="/admin-registration-query.js?v=restore1"></script>
  <script src="/smart-activity.js?v=v2split1"></script>
  <script src="/smart-activity-publish.js?v=publish1"></script>
  <script src="/smart-activity-staged.js?v=staged1"></script>
  <script src="/smart-activity-intelligence.js?v=rules2"></script>
  <script src="/smart-activity-docs.js?v=docs1"></script>
  <script src="/smart-activity-points.js?v=points1"></script>
</body>
</html>
