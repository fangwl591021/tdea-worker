<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TDEA 廣告贈點</title>
  <meta name="robots" content="noindex,nofollow">
</head>
<body>
  <div id="app"><main style="max-width:840px;margin:0 auto;padding:24px 16px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif"><section style="background:#ecfdf3;border:1px solid #abefc6;border-radius:10px;padding:18px;color:#067647;font-weight:800">載入廣告贈點...</section></main></div>
  <script src="/marquee-standalone.js?v=20260821-4"></script>
  <script>
    (() => {
      const app = document.getElementById('app');
      const fail = () => {
        if (app) app.innerHTML = '<main style="max-width:840px;margin:0 auto;padding:24px 16px;font-family:system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif"><section style="background:#fff3f0;border:1px solid #fecdca;border-radius:10px;padding:18px;color:#b42318;font-weight:800">廣告模組載入失敗，請重新整理。</section></main>';
      };
      const start = () => {
        try {
          if (typeof window.__tdeaMarqueeStandaloneStart === 'function') {
            Promise.resolve(window.__tdeaMarqueeStandaloneStart()).catch(fail);
            return;
          }
        } catch (_) {}
        fail();
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
      else start();
      setTimeout(() => {
        if (app?.textContent?.includes('載入廣告贈點')) start();
      }, 1200);
    })();
  </script>
</body>
</html>
